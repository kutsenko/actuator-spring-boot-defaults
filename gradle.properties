# Gradle daemon JVM args. The ~512m default is too small for this
# project's in-process Java compilation plus the :app:test orchestration
# (test-event aggregation + JaCoCo) and produced flaky "Java heap space"
# failures inside the daemon. 3g leaves ample headroom on the CI host.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
