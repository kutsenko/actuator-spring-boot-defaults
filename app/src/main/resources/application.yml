spring:
  application:
    name: actuator-spring-boot-defaults

# Actuator defaults: expose health, info, prometheus over HTTP; keep everything
# else off the web surface. Health shows details only to authenticated principals
# in real deployments — kept "when-authorized" as the safe default here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
